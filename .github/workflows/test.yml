name: Test Zen Browser Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly to check for new releases
    - cron: '0 0 * * 0'

jobs:
  test-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Enable Nix flakes
      run: |
        echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
        sudo systemctl restart nix-daemon

    - name: Test x86_64-linux build
      run: |
        nix build .#packages.x86_64-linux.zen-browser --no-link
        nix flake check --no-build

    - name: Test default package
      run: |
        nix build .#packages.x86_64-linux.default --no-link

  test-linux-aarch64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Enable Nix flakes
      run: |
        echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
        sudo systemctl restart nix-daemon

    - name: Setup QEMU for cross-compilation
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binfmt-support

    - name: Test aarch64-linux build
      run: |
        # Test that the package can be evaluated (cross-compilation may not work fully in CI)
        nix eval .#packages.aarch64-linux.zen-browser.name --raw
        nix eval .#packages.aarch64-linux.zen-browser.version --raw

  test-macos-universal:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Test aarch64-darwin build
      run: |
        nix build .#packages.aarch64-darwin.zen-browser --no-link

    - name: Test x86_64-darwin build
      run: |
        nix build .#packages.x86_64-darwin.zen-browser --no-link

    - name: Test default package
      run: |
        nix build .#packages.aarch64-darwin.default --no-link

  integration-test:
    runs-on: ubuntu-latest
    needs: [test-linux-x86_64]
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Enable Nix flakes
      run: |
        echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
        sudo systemctl restart nix-daemon

    - name: Build and test executable
      run: |
        nix build .#packages.x86_64-linux.zen-browser
        # Check that the binary exists and has correct permissions
        ls -la result/bin/zen-browser
        file result/bin/zen-browser

    - name: Test desktop entry
      run: |
        # Check that desktop entry exists
        test -f result/share/applications/zen-browser.desktop
        echo "✓ Desktop entry file exists"

        # Display desktop entry contents for debugging
        echo "Desktop entry contents:"
        cat result/share/applications/zen-browser.desktop

        # Validate desktop entry format
        sudo apt-get update && sudo apt-get install -y desktop-file-utils
        desktop-file-validate result/share/applications/zen-browser.desktop
        echo "✓ Desktop entry is valid"

        # Check that Exec path points to the actual binary
        EXEC_PATH=$(grep "^Exec=" result/share/applications/zen-browser.desktop | cut -d' ' -f1 | cut -d'=' -f2)
        echo "Exec path from desktop entry: $EXEC_PATH"
        if [ -x "$EXEC_PATH" ]; then
          echo "✓ Executable referenced in desktop entry exists and is executable"
        else
          echo "✗ Executable not found or not executable: $EXEC_PATH"
          exit 1
        fi

        # Verify the executable can show version
        "$EXEC_PATH" --version
        echo "✓ Executable can run and show version"

        # Check that desktop entry has required fields
        grep -q "^Name=" result/share/applications/zen-browser.desktop
        grep -q "^Comment=" result/share/applications/zen-browser.desktop
        grep -q "^GenericName=" result/share/applications/zen-browser.desktop
        grep -q "^Icon=" result/share/applications/zen-browser.desktop
        grep -q "^Categories=" result/share/applications/zen-browser.desktop
        grep -q "^MimeType=" result/share/applications/zen-browser.desktop
        echo "✓ All required desktop entry fields are present"

    - name: Test icon installation
      run: |
        # Check that icon exists
        test -f result/share/icons/hicolor/scalable/apps/zen-browser.svg
        echo "✓ Icon file exists"

        # Validate SVG format
        file result/share/icons/hicolor/scalable/apps/zen-browser.svg | grep -q "SVG"
        echo "✓ Icon is a valid SVG file"

    - name: Test flake metadata
      run: |
        nix flake metadata
        nix flake show
